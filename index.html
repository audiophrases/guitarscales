<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyzer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="top-controls">
        <div class="chord-builder" aria-label="Chord builder">
          <select id="chord-root" aria-label="Chord root"></select>
          <select id="chord-quality" aria-label="Chord quality"></select>
          <button id="add-chord" type="button">Add chord</button>
        </div>
        <div class="lang-switch">
          <label for="language-select">Language</label>
          <select id="language-select" aria-label="Language selector">
            <option value="en">EN</option>
            <option value="ca">CA</option>
          </select>
        </div>
      </div>
      <div id="selected-chords" class="selected-chords" aria-live="polite"></div>
      <p id="runtime-status" class="summary-note" aria-live="polite"></p>

      <section id="fretboard-lab">
        <p id="fretboard-caption">Select or add chords to instantly update the fretboard map.</p>
        <div class="fretboard-container" id="shared-fretboard"></div>
      </section>

      <section id="whole-song">
        <h2>Whole Song Musical Direction</h2>
      </section>

      <section id="per-chord">
        <h2>Per Chord Strategy</h2>
      </section>

      <section id="genius-guide">
        <h2>Genius Note Navigator</h2>
      </section>
    </main>

    <script>
      window.reportDependencyError = function reportDependencyError(name, url) {
        console.error(`Failed to load ${name} from ${url}`);
        const runtimeStatus = document.getElementById('runtime-status');
        if (runtimeStatus) {
          runtimeStatus.textContent = `${name} failed to load. Some features are unavailable.`;
        }
      };
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"
      onerror="window.reportDependencyError('Tonal', this.src)"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
